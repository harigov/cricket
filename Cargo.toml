[package]
name = "cricket"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "std",
    "async_executor",
    "android_shared_stdcxx",
    "bevy_animation",
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_gltf",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "multi_threaded",
    "png",
    "sysinfo_plugin",
    "tonemapping_luts",
    "vorbis",
    "wav",
    "webgl2",
    "x11",
    "ktx2",
    "zstd_rust",
    "debug",
    "serialize",
] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# Compile dependencies with optimizations even in dev builds,
# but keep our own crate fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
