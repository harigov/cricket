[package]
name = "cricket"
version = "0.1.0"
edition = "2024"

# Lint policy — enforced by `scripts/check.sh` and CI (`cargo clippy -- -D warnings`).
[lints.clippy]
all = { level = "warn", priority = -1 }
# Bevy systems and scene spawners legitimately take many parameters (queries,
# resources, asset stores). We group them into `SystemParam`/context structs
# where that aids readability rather than chasing the arity threshold.
too_many_arguments = "allow"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "std",
    "async_executor",
    "android_shared_stdcxx",
    "bevy_animation",
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_gltf",
    "gltf_animation",
    "bevy_log",
    "bevy_pbr",
    # Depth of field lives behind this feature. Aerial haze alone cannot sell
    # distance — it desaturates the far bowl but leaves it pin-sharp — so the
    # gameplay camera pairs the fog with a mild defocus (see `update_camera`).
    "bevy_post_process",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "multi_threaded",
    "png",
    "reflect_auto_register",
    "sysinfo_plugin",
    "tonemapping_luts",
    "vorbis",
    "wav",
    "webgl2",
    # Both Linux windowing backends: winit picks Wayland when the session
    # provides it and falls back to X11 otherwise. Going through XWayland on a
    # Wayland session stalls NVIDIA's Vulkan swapchain acquire once the
    # compositor stops presenting to an idle window, which bevy_render turns
    # into a hard panic on adapters outside its AMD/Intel timeout allowlist.
    "wayland",
    "x11",
    "ktx2",
    "zstd_rust",
    "debug",
    "serialize",
] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# Compile dependencies with optimizations even in dev builds,
# but keep our own crate fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
